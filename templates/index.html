<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy — AI Fitness Plan Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="navbar__logo">💪 FitBuddy</a>
        <div class="navbar__links">
            <a href="/view-all-users">Admin Dashboard</a>
        </div>
    </nav>

    <!-- Loading Overlay (hidden by default) -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p class="loading-text">Generating your personalized plan...</p>
    </div>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero__content">
            <h1 class="text-gradient">Your AI-Powered<br>Fitness Journey</h1>
            <p class="hero__subtitle">Get a personalized 7-day workout plan powered by Google Gemini AI</p>
            
            <!-- Error Alert -->
            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <!-- Form Card -->
            <div class="card card-glass">
                <form id="workoutForm" action="/generate-workout" method="POST">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" id="name" name="name" class="form-input" placeholder="John Doe" required aria-required="true">
                            <span class="form-error" id="nameError"></span>
                        </div>
                        <div class="form-group">
                            <label for="user_id" class="form-label">User ID</label>
                            <input type="text" id="user_id" name="user_id" class="form-input" placeholder="johndoe123" required aria-required="true">
                            <span class="form-error" id="userIdError"></span>
                        </div>
                        <div class="form-group">
                            <label for="age" class="form-label">Age</label>
                            <input type="number" id="age" name="age" class="form-input" placeholder="25" min="1" max="119" required aria-required="true">
                            <span class="form-error" id="ageError"></span>
                        </div>
                        <div class="form-group">
                            <label for="weight" class="form-label">Weight (kg)</label>
                            <input type="number" id="weight" name="weight" class="form-input" placeholder="70" min="1" step="0.1" required aria-required="true">
                            <span class="form-error" id="weightError"></span>
                        </div>
                        <div class="form-group form-group--full">
                            <label for="goal" class="form-label">Fitness Goal</label>
                            <select id="goal" name="goal" class="form-select" required aria-required="true">
                                <option value="" disabled selected>Select your goal</option>
                                <option value="Weight Loss">🔥 Weight Loss</option>
                                <option value="Muscle Gain">💪 Muscle Gain</option>
                                <option value="General Fitness">🏃 General Fitness</option>
                                <option value="Flexibility & Mobility">🧘 Flexibility & Mobility</option>
                                <option value="Endurance">🚴 Endurance</option>
                                <option value="Strength">🏋️ Strength Training</option>
                            </select>
                            <span class="form-error" id="goalError"></span>
                        </div>
                        <div class="form-group form-group--full">
                            <label class="form-label">Workout Intensity</label>
                            <div class="segmented-control">
                                <input type="radio" id="intensity-low" name="intensity" value="low" required>
                                <label for="intensity-low">🌱 Low</label>
                                <input type="radio" id="intensity-medium" name="intensity" value="medium">
                                <label for="intensity-medium">⚡ Medium</label>
                                <input type="radio" id="intensity-high" name="intensity" value="high">
                                <label for="intensity-high">🔥 High</label>
                            </div>
                            <span class="form-error" id="intensityError"></span>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn--full" id="submitBtn">
                        Generate My Plan →
                    </button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>FitBuddy © 2024 — Powered by Google Gemini AI</p>
    </footer>

    <script src="{{ url_for('static', path='js/main.js') }}"></script>
</body>
</html>
